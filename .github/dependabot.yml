# Dependabot reads this file from the default branch and opens a pull request for each update it finds.
version: 2
updates:
  # Directory.Packages.props holds every package version, and global.json holds MSTest.Sdk. Only these projects restore
  # from nuget.org alone: extensions, samples and the integration tests also need the patched Native AOT runtime packages
  # that CI builds. Together they reference every package in Directory.Packages.props.
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/Ankus.Build.Tests
      - /tests/Ankus.Generators.Tests
      - /tests/Ankus.PgConfig.Tests
      - /tests/Ankus.Runtime.Tests
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
    ignore:
      # The generators and code fixes load into the compiler of the oldest SDK global.json accepts, so Roslyn must not be
      # newer than that compiler. These versions move by hand, together with the minimum SDK.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
      # These libraries match the Native AOT runtime that extensions embed, and move with it in each .NET servicing
      # update (see docs/contributing/dotnet-support.md).
      - dependency-name: System.Formats.Cbor
      - dependency-name: System.Diagnostics.EventLog

  # One pull request for the actions the workflows use, since they are tested together anyway.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  # The documentation site. Its packages never reach an extension, so they also arrive as one pull request.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
    groups:
      docs:
        patterns:
          - "*"
    ignore:
      # astro check supports TypeScript 5 and 6. Take TypeScript 7 once @astrojs/check accepts it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
