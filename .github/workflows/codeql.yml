name: CodeQL

on:
  # No analyzed language reads Markdown, so commits that change only Markdown are not scanned again.
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The SDK's telemetry can deadlock a build against MSBuild's logging; see NativeAotExtensionTests.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # JavaScript and TypeScript are the documentation site.
        language: [actions, csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # These languages are read from source, so the scan does not need the patched runtime or PostgreSQL. Each test
      # project states the global using that MSTest adds through MSBuild, so the C# scan resolves the test framework.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: artifacts/codeql-results

      - name: Archive CodeQL results
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-${{ matrix.language }}-${{ github.run_attempt }}
          path: artifacts/codeql-results/**/*.sarif
          if-no-files-found: error

      # Code scanning keeps a result open even when a `codeql[rule]` comment marks it, so the alerts of marked results
      # are dismissed on main with each comment's reason.
      - name: Dismiss alerts suppressed in source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATEGORY: /language:${{ matrix.language }}
        run: dotnet run --file ./eng/Ankus.CodeQl.cs -- dismiss artifacts/codeql-results "$CATEGORY"

      # Code scanning lists findings without failing anything, so a new one would go unseen.
      - name: Require zero findings
        run: dotnet run --file ./eng/Ankus.CodeQl.cs -- artifacts/codeql-results

  # The C in Ankus is the native bridge each extension compiles, which the generator emits, and test fixtures composed
  # from it. CodeQL traces those compilations as the integration tests perform them, with the patched runtime and
  # PostgreSQL's headers that only the dedicated Linux runners hold, so pull requests do not run this job.
  analyze-native:
    name: Analyze c-cpp
    if: github.event_name != 'pull_request' && github.repository == 'willibrandon/ankus'
    runs-on: [self-hosted, Linux, X64, ankus-linux-x64]
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read runtime identity
        id: runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- metadata

      - uses: actions/cache/restore@v6
        id: runtime-cache
        with:
          path: artifacts/nativeaot/linux-x64
          key: nativeaot-v3-linux-x64-dedicated-${{ steps.runtime.outputs.commit }}

      - uses: actions/checkout@v7
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime
          persist-credentials: false

      - name: Build runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-build linux x64 linux-x64

      - name: Save runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/nativeaot/linux-x64
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Restore NuGet packages
        run: dotnet restore Ankus.slnx -p:Platform="Any CPU"

      - name: Build PostgreSQL tests
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-test-build linux-x64 18

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql-config.yml

      - name: Compile the native bridge and fixtures
        run: dotnet run --file ./eng/Ankus.Ci.cs -- native-analysis-run

      # CodeQL sizes its analysis to most of the host's memory by default. The dedicated Linux host also runs version
      # suites of about 15 GB each, and two analyses beside them had the kernel stop a runner.
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          output: artifacts/codeql-results
          ram: 12288

      - name: Archive CodeQL results
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-c-cpp-${{ github.run_attempt }}
          path: artifacts/codeql-results/**/*.sarif
          if-no-files-found: error

      - name: Dismiss alerts suppressed in source
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --file ./eng/Ankus.CodeQl.cs -- dismiss artifacts/codeql-results /language:c-cpp

      - name: Require zero findings
        run: dotnet run --file ./eng/Ankus.CodeQl.cs -- artifacts/codeql-results

      - name: Clean generated runner files
        if: always()
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runner-cleanup
