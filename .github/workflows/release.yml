name: Release

on:
  release:
    types: [published]
  # A dry run builds, packs and verifies every package from the dispatched commit without publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rehearse, such as v0.1.0
        type: string
        default: v0.1.0

permissions:
  contents: read

env:
  ANKUS_RUNNER_PRIVATE_IDENTIFIERS: ${{ secrets.ANKUS_RUNNER_PRIVATE_IDENTIFIERS }}
  # Runners on one host share an account. Each keeps its own NuGet HTTP cache beside its checkout from the first
  # restore on, so concurrent jobs never replace the same cached response; see eng/README.md.
  NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/../nuget-http-cache
  # The SDK's telemetry can deadlock a build against MSBuild's logging; see NativeAotExtensionTests.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
  # The .NET 11 SDK that the net11.0 runtime line's fork probes build with.
  ANKUS_DOTNET11_SDK: 11.0.100-rc.2.26504.105

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Actions drops job outputs that contain a masked value, which the runtime repository name can, so each
    # packaging job reads the runtime identity itself, as CI does.
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: dotnet run --file ./eng/Ankus.Ci.cs -- release-metadata

  managed-packages:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack managed packages
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- release-managed
          ${{ needs.metadata.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: managed-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

  runtime-packages:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        # Each supported target framework ships its own patched runtime and compiler host packages.
        line: [net10.0, net11.0]
        target:
          - runner: ${{ github.repository == 'ankus-net/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && 'ankus-linux-primary-x64' || 'ubuntu-24.04' }}
            rid: linux-x64
            platform: linux
            architecture: x64
            timeout: 60
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            platform: linux
            architecture: arm64
            timeout: 180
          - runner: ${{ github.repository == 'ankus-net/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && 'ankus-macos-arm64' || 'macos-15' }}
            rid: osx-arm64
            platform: osx
            architecture: arm64
            timeout: 60
          - runner: macos-26-intel
            rid: osx-x64
            platform: osx
            architecture: x64
            timeout: 360
          - runner: ${{ github.repository == 'ankus-net/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && 'ankus-windows-x64' || 'windows-2025' }}
            rid: win-x64
            platform: windows
            architecture: x64
            timeout: 60
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: ${{ matrix.target.timeout }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            ${{ env.ANKUS_DOTNET11_SDK }}

      - name: Read runtime metadata
        id: runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- metadata ${{ matrix.line }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime

      # Without an active developer environment the runtime's build takes the newest Visual Studio, previews included.
      - name: Select Windows C++ toolchain
        if: runner.os == 'Windows'
        run: dotnet run --file ./eng/Ankus.Ci.cs -- windows-toolchain

      - name: Build and pack runtime
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- release-runtime
          ${{ matrix.target.platform }}
          ${{ matrix.target.architecture }}
          ${{ matrix.target.rid }}
          ${{ matrix.line }}

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-package-${{ matrix.line }}-${{ matrix.target.rid }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

      - name: Clean generated runner files
        if: always()
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runner-cleanup

  verify:
    needs: [metadata, managed-packages, runtime-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          pattern: '*package*'
          path: artifacts/packages
          merge-multiple: true

      - name: Verify packages
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- release-verify
          ${{ needs.metadata.outputs.version }}

  publish:
    needs: [metadata, verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          pattern: '*package*'
          path: artifacts/packages
          merge-multiple: true

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- publish
          ${{ needs.metadata.outputs.version }}
