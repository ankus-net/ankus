name: Release

on:
  release:
    types: [published]
  # A dry run builds and packs every package from the dispatched commit without publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rehearse, such as v0.1.0
        type: string
        default: v0.1.0

permissions:
  contents: read

env:
  ANKUS_RUNNER_PRIVATE_IDENTIFIERS: ${{ secrets.ANKUS_RUNNER_PRIVATE_IDENTIFIERS }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      runtime_repository: ${{ steps.metadata.outputs.repository }}
      runtime_commit: ${{ steps.metadata.outputs.commit }}
      runtime_version: ${{ steps.metadata.outputs.runtime_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: dotnet run --file ./eng/Ankus.Ci.cs -- release-metadata

  managed-packages:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack managed packages
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- release-managed
          ${{ needs.metadata.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: managed-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

  runtime-packages:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && 'ankus-linux-primary-x64' || 'ubuntu-24.04' }}
            rid: linux-x64
            platform: linux
            architecture: x64
            timeout: 60
          - runner: ${{ github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && 'ankus-macos-arm64' || 'macos-15' }}
            rid: osx-arm64
            platform: osx
            architecture: arm64
            timeout: 60
          - runner: macos-26-intel
            rid: osx-x64
            platform: osx
            architecture: x64
            timeout: 360
          - runner: ${{ github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && 'ankus-windows-x64' || 'windows-2025' }}
            rid: win-x64
            platform: windows
            architecture: x64
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/checkout@v5
        with:
          repository: ${{ needs.metadata.outputs.runtime_repository }}
          ref: ${{ needs.metadata.outputs.runtime_commit }}
          path: runtime

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and pack runtime
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- release-runtime
          ${{ matrix.platform }}
          ${{ matrix.architecture }}
          ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-package-${{ matrix.rid }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [metadata, managed-packages, runtime-packages]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          pattern: '*package*'
          path: artifacts/packages
          merge-multiple: true

      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- publish
          ${{ needs.metadata.outputs.version }}
