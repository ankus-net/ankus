name: Additional platforms

on:
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:
    inputs:
      postgresql:
        description: PostgreSQL major to test on macOS x64, or all
        type: string
        default: '18'
      package-test-concurrency:
        description: Package-consumer slots (empty uses the fixture default)
        type: string
        required: false
      jobs:
        description: Run the full suites, the cross-architecture target check, or both
        type: choice
        options: [all, tests, target]
        default: all

permissions:
  contents: read

env:
  ANKUS_RUNNER_PRIVATE_IDENTIFIERS: ${{ secrets.ANKUS_RUNNER_PRIVATE_IDENTIFIERS }}
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  runtime:
    if: github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, X64, ankus-macos-x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read runtime identity
        id: runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- metadata

      - name: Restore native runtime
        uses: actions/cache/restore@v5
        id: runtime-cache
        with:
          path: artifacts/nativeaot/osx-x64
          key: nativeaot-v3-osx-x64-dedicated-${{ steps.runtime.outputs.commit }}

      - uses: actions/checkout@v5
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime

      - name: Build native runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-build osx x64 osx-x64

      - name: Save native runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: artifacts/nativeaot/osx-x64
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Pack runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-pack osx-x64

      - uses: actions/upload-artifact@v7
        with:
          name: nativeaot-osx-x64
          path: artifacts/nativeaot/osx-x64
          if-no-files-found: error
          retention-days: 3

  macos-x64:
    needs: runtime
    if: github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && github.ref == 'refs/heads/main' && inputs.jobs != 'target'
    strategy:
      fail-fast: false
      # One Intel runner serves every major in turn.
      max-parallel: 1
      matrix:
        postgresql: ${{ fromJSON((github.event_name == 'schedule' || inputs.postgresql == 'all') && '[13,14,15,16,17,18,19]' || format('[{0}]', inputs.postgresql || '18')) }}
    name: macos-x64 (${{ matrix.postgresql }})
    runs-on: [self-hosted, macOS, X64, ankus-macos-x64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet package cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v5
        id: nuget-cache
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('global.json', 'Directory.*', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets', 'tests/**/*.csproj', 'samples/**/*.csproj') }}
          restore-keys: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - uses: actions/download-artifact@v8
        with:
          name: nativeaot-osx-x64
          path: artifacts/nativeaot/osx-x64

      - name: Restore NuGet packages
        run: dotnet restore Ankus.slnx -p:Platform="Any CPU"

      - name: Save NuGet package cache
        if: runner.environment != 'self-hosted' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Restore native binding cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v5
        id: binding-cache
        with:
          path: artifacts/binding-cache
          key: bindings-v1-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.postgresql }}-${{ github.sha }}
          restore-keys: bindings-v1-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.postgresql }}-

      - name: Build PostgreSQL tests
        env:
          # MacPorts provides 18 on PATH; other majors are named by repository variables.
          PG13_PG_CONFIG: ${{ vars.ANKUS_MACOS_X64_PG13_PG_CONFIG }}
          PG14_PG_CONFIG: ${{ vars.ANKUS_MACOS_X64_PG14_PG_CONFIG }}
          PG15_PG_CONFIG: ${{ vars.ANKUS_MACOS_X64_PG15_PG_CONFIG }}
          PG16_PG_CONFIG: ${{ vars.ANKUS_MACOS_X64_PG16_PG_CONFIG }}
          PG17_PG_CONFIG: ${{ vars.ANKUS_MACOS_X64_PG17_PG_CONFIG }}
          PG19_PG_CONFIG: ${{ vars.ANKUS_MACOS_X64_PG19_PG_CONFIG }}
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-test-build osx-x64 ${{ matrix.postgresql }}

      - name: Save native binding cache
        if: runner.environment != 'self-hosted' && steps.binding-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: artifacts/binding-cache
          key: ${{ steps.binding-cache.outputs.cache-primary-key }}

      - name: Run full PostgreSQL tests
        env:
          ANKUS_PACKAGE_TEST_CONCURRENCY: ${{ inputs.package-test-concurrency || vars.ANKUS_MACOS_PACKAGE_TEST_CONCURRENCY || '' }}
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-test-run

      - name: Prepare test reports
        if: always()
        id: reports
        run: dotnet run --file ./eng/Ankus.Ci.cs -- prepare-reports

      - name: Save test results and timings
        if: always() && steps.reports.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-osx-x64-pg${{ matrix.postgresql }}
          path: |
            artifacts/ci-reports/test-results/*.trx
            artifacts/ci-reports/test-results/process-timings.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save failure logs
        if: (failure() || cancelled()) && steps.reports.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-osx-x64-pg${{ matrix.postgresql }}
          path: artifacts/ci-reports/test-logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean generated runner files
        if: always()
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runner-cleanup

  # Intel macOS from Apple silicon: the Intel runner exports its PostgreSQL 18 target information, the Apple silicon
  # runner builds the Hello sample from it without Clang or libclang, and the Intel runner loads the result.
  target-export:
    needs: runtime
    if: github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && github.ref == 'refs/heads/main' && inputs.jobs != 'tests'
    name: target export (osx-x64)
    runs-on: [self-hosted, macOS, X64, ankus-macos-x64]
    # The first export, with a cold binding source cache, took 94 seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nativeaot-osx-x64
          path: artifacts/nativeaot/osx-x64

      - name: Export PostgreSQL target information
        run: dotnet run --file ./eng/Ankus.Ci.cs -- target-export osx-x64 18 artifacts/target/ankus-target.pg18.osx-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: target-osx-x64
          path: artifacts/target
          if-no-files-found: error
          retention-days: 3

      - name: Clean generated runner files
        if: always()
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runner-cleanup

  target-build:
    needs: [runtime, target-export]
    if: github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && github.ref == 'refs/heads/main' && inputs.jobs != 'tests'
    name: target build (osx-x64 on osx-arm64)
    runs-on: ankus-macos-arm64
    # The first cross build took 67 seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read runtime identity
        id: runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- metadata

      # The host compiler comes from the primary workflow's Apple silicon runtime build.
      - name: Restore host native runtime
        uses: actions/cache/restore@v5
        with:
          path: artifacts/nativeaot/osx-arm64
          key: nativeaot-v3-osx-arm64-dedicated-${{ steps.runtime.outputs.commit }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8
        with:
          name: nativeaot-osx-x64
          path: artifacts/nativeaot/osx-x64

      - uses: actions/download-artifact@v8
        with:
          name: target-osx-x64
          path: artifacts/target

      - name: Build from target information
        run: dotnet run --file ./eng/Ankus.Ci.cs -- target-build artifacts/target/ankus-target.pg18.osx-x64.zip osx-x64 artifacts/target-build

      - uses: actions/upload-artifact@v7
        with:
          name: target-build-osx-x64
          path: artifacts/target-build
          if-no-files-found: error
          retention-days: 3

      - name: Clean generated runner files
        if: always()
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runner-cleanup

  target-verify:
    needs: target-build
    if: github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && github.ref == 'refs/heads/main' && inputs.jobs != 'tests'
    name: target verify (osx-x64)
    runs-on: [self-hosted, macOS, X64, ankus-macos-x64]
    # The first load check took 32 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: target-build-osx-x64
          path: artifacts/target-build

      - name: Load the cross-built extension
        run: dotnet run --file ./eng/Ankus.Ci.cs -- target-verify artifacts/target-build 18

      - name: Clean generated runner files
        if: always()
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runner-cleanup
