name: PostgreSQL platform versions

on:
  schedule:
    - cron: '23 6 * * 4'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test, or all
        type: choice
        default: all
        options: [all, osx-arm64, win-x64]
      postgresql:
        description: PostgreSQL major to test, or all; primary CI covers macOS 18 and Windows 17
        type: choice
        default: all
        options: [all, '13', '14', '15', '16', '17', '18', '19']
      package-test-concurrency:
        description: Package-consumer slots (empty uses each runner setting)
        type: string
        required: false

permissions:
  contents: read

env:
  ANKUS_RUNNER_PRIVATE_IDENTIFIERS: ${{ secrets.ANKUS_RUNNER_PRIVATE_IDENTIFIERS }}
  MSBUILDDISABLENODEREUSE: '1'
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'

jobs:
  runtime:
    if: github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ankus-macos-arm64
            rid: osx-arm64
            platform: osx
            architecture: arm64
          - runner: ankus-windows-x64
            rid: win-x64
            platform: windows
            architecture: x64
    runs-on: [self-hosted, '${{ matrix.runner }}']
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read runtime identity
        id: runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- metadata

      - name: Restore native runtime
        uses: actions/cache/restore@v6
        id: runtime-cache
        with:
          path: artifacts/nativeaot/${{ matrix.rid }}
          key: nativeaot-v3-${{ matrix.rid }}-${{ runner.os != 'Windows' && 'dedicated-' || '' }}${{ steps.runtime.outputs.commit }}

      - uses: actions/checkout@v7
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime

      - name: Build native runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-build ${{ matrix.platform }} ${{ matrix.architecture }} ${{ matrix.rid }}

      - name: Save native runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/nativeaot/${{ matrix.rid }}
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Pack runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-pack ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: nativeaot-${{ matrix.rid }}-platform-versions
          path: artifacts/nativeaot/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 3

  test:
    if: github.repository == 'willibrandon/ankus' && github.actor == 'willibrandon' && github.triggering_actor == 'willibrandon' && github.ref == 'refs/heads/main'
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ fromJSON((inputs.platform == '' || inputs.platform == 'all') && '["osx-arm64","win-x64"]' || format('["{0}"]', inputs.platform)) }}
        postgresql: ${{ fromJSON((inputs.postgresql == '' || inputs.postgresql == 'all') && '[13,14,15,16,17,18,19]' || format('[{0}]', inputs.postgresql)) }}
        # Primary CI runs the full suite on macOS ARM64 with 18 and Windows x64 with 17.
        exclude:
          - rid: osx-arm64
            postgresql: 18
          - rid: win-x64
            postgresql: 17
    runs-on: [self-hosted, "${{ matrix.rid == 'win-x64' && 'ankus-windows-x64' || 'ankus-macos-arm64' }}"]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select Windows C++ toolchain
        if: runner.os == 'Windows'
        run: dotnet run --file ./eng/Ankus.Ci.cs -- windows-toolchain

      - uses: actions/download-artifact@v8
        with:
          name: nativeaot-${{ matrix.rid }}-platform-versions
          path: artifacts/nativeaot/${{ matrix.rid }}

      - name: Restore NuGet packages
        run: dotnet restore Ankus.slnx -p:Platform="Any CPU"

      - name: Restore native binding cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v6
        id: binding-cache
        with:
          path: artifacts/binding-cache
          key: bindings-v1-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.postgresql }}-${{ github.sha }}
          restore-keys: bindings-v1-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.postgresql }}-

      - name: Build PostgreSQL tests
        env:
          PGROOT: ${{ runner.os == 'Windows' && secrets[format('ANKUS_WINDOWS_PG{0}_ROOT', matrix.postgresql)] || '' }}
          # macOS majors without a Homebrew formula on the runner come from `ankus init` builds named by repository variables.
          PG13_PG_CONFIG: ${{ runner.os == 'macOS' && vars.ANKUS_MACOS_PG13_PG_CONFIG || '' }}
          PG14_PG_CONFIG: ${{ runner.os == 'macOS' && vars.ANKUS_MACOS_PG14_PG_CONFIG || '' }}
          PG17_PG_CONFIG: ${{ runner.os == 'macOS' && vars.ANKUS_MACOS_PG17_PG_CONFIG || '' }}
          PG19_PG_CONFIG: ${{ runner.os == 'macOS' && vars.ANKUS_MACOS_PG19_PG_CONFIG || '' }}
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-test-build ${{ matrix.rid }} ${{ matrix.postgresql }}

      - name: Save native binding cache
        if: runner.environment != 'self-hosted' && steps.binding-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/binding-cache
          key: ${{ steps.binding-cache.outputs.cache-primary-key }}

      - name: Run full PostgreSQL tests
        env:
          ANKUS_PACKAGE_TEST_CONCURRENCY: ${{ inputs.package-test-concurrency || (runner.os == 'Windows' && vars.ANKUS_WINDOWS_PACKAGE_TEST_CONCURRENCY) || (runner.os == 'macOS' && vars.ANKUS_MACOS_PACKAGE_TEST_CONCURRENCY) || '' }}
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-test-run

      - name: Remove private identifiers from reports
        if: always()
        id: reports
        run: dotnet run --file ./eng/Ankus.Ci.cs -- prepare-reports

      - name: Save test results and timings
        if: always() && steps.reports.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}-pg${{ matrix.postgresql }}
          path: |
            artifacts/ci-reports/test-results/*.trx
            artifacts/ci-reports/test-results/process-timings.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save failure logs
        if: (failure() || cancelled()) && steps.reports.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.rid }}-pg${{ matrix.postgresql }}
          path: artifacts/ci-reports/test-logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean generated runner files
        if: always()
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runner-cleanup
