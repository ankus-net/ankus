name: Secret scan

# Every change is scanned, including documentation-only changes that CI skips.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  picket:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reports are fully redacted, and the cache keeps only hashes, because the logs and caches of a public repository
      # are public. A pull request from a fork cannot upload results, so only branch scans do.
      - name: Scan for secrets
        uses: willibrandon/picket@4c9f7d28260bfe0a7334865c84db093519f6f57f # v0.2.12
        with:
          cache-mode: secret-hash-only
          fail-on: findings
          redact: 100
          timeout: 300
          upload-sarif: ${{ github.event_name != 'pull_request' }}
